# -------------------------
# Core renderer & GPU
# -------------------------
vo=gpu-next
gpu-api=d3d11
profile=gpu-hq
dither-depth=8
dither=fruit
temporal-dither=yes

# -------------------------
# Hardware decoding (NVIDIA, Windows)
# -------------------------
hwdec=nvdec-copy
hwdec-codecs=all
vd-lavc-dr=yes

# -------------------------
# Scaling & quality (good for 1080p→2560×1080)
# -------------------------
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
scale-antiring=0.7

# -------------------------
# Debanding (helps with compressed streams)
# -------------------------
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=25
deband-grain=2

# -------------------------
# HDR / tone mapping (if you watch HDR content)
# -------------------------
tone-mapping=bt.2390
hdr-compute-peak=yes
target-colorspace-hint=no

# -------------------------
# Audio (passthrough if you have an AVR/receiver, otherwise safe defaults)
# -------------------------
ao=wasapi
audio-exclusive=no
audio-channels=stereo
audio-normalize-downmix=yes
audio-pitch-correction=yes
volume-max=150

# -------------------------
# Ultrawide options
# -------------------------

keepaspect=yes
video-aspect-override=no
video-aspect-method=container

# -------------------------
# Motion & Refresh Rate Sync
# -------------------------

video-sync=display-resample
interpolation=yes
tscale=oversample

# -------------------------
# UI Related Values
# -------------------------

video-zoom=0.0
brightness=0
contrast=0
saturation=0
gamma=0
video-rotate=0
screenshot-format=png
